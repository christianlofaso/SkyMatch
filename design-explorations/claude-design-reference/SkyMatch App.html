<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="mint">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SkyMatch — App</title>
<link rel="stylesheet" href="app/skymatch.css" />
</head>
<body>

<!-- aurora gradient defs (used by logo + svgs) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="aur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79F2C0"/>
      <stop offset=".5" stop-color="#52CFEC"/>
      <stop offset="1" stop-color="#8FA2FF"/>
    </linearGradient>
  </defs>
</svg>

<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- app modules (order matters) -->
<script type="text/babel" src="app/tweaks-panel.jsx"></script>
<script type="text/babel" src="app/data.jsx"></script>
<script type="text/babel" src="app/ui.jsx"></script>
<script type="text/babel" src="app/store.jsx"></script>
<script type="text/babel" src="app/shell.jsx"></script>
<script type="text/babel" src="app/dashboard.jsx"></script>
<script type="text/babel" src="app/analyzer.jsx"></script>
<script type="text/babel" src="app/extras.jsx"></script>
<script type="text/babel" src="app/flow.jsx"></script>
<script type="text/babel" src="app/app.jsx"></script>

</body>
</html>
