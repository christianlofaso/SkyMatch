# CI gate — runs on every push + PR. A red check blocks the Railway/Vercel deploy
# (configure "wait for CI" / required status checks in each platform). Mirrors the local
# pre-ship checks: backend compiles + imports cleanly; frontend type-checks.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # import main constructs the Anthropic client at import time (needs a key present, not
      # valid). The DB pool is built open=False so no real DATABASE_URL connection happens.
      ANTHROPIC_API_KEY: ci-dummy-key
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Byte-compile all sources
        run: python -m compileall -q .
      - name: Import the app (wiring smoke test)
        run: python -c "import main; print('routes:', len(main.app.routes))"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
