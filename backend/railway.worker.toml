# Railway config-as-code for the WORKER service (ingestion: worker/ingest.py).
# Create a SECOND Railway service from the same repo, set its root directory to backend/,
# and set its "Config Path" to backend/railway.worker.toml so it uses THIS file instead of
# railway.toml. Same image as web — only the run shape differs.
#
# It's a CRON service: run-to-exit every ~8h (one ingest pass = national pool + per-rotation
# metro local + reach pool), NOT a long-running server. No replicas, no healthcheck.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# === INGESTION RESUMED 2026-06-21 ===
# Paused 2026-06-17; resumed to repopulate the index (national pool had aged past
# SERVE_MAX_AGE_HOURS=48h, leaving big_tech/startup/reach empty). NOTE: staging AND prod
# both read this file, so this resumes both.
#
# Every 8 hours (00:00, 08:00, 16:00 UTC). Keep comfortably under SERVE_MAX_AGE_HOURS
# (48h) so the index never goes stale. Railway starts a fresh container per tick; it exits
# when the pass finishes.
cronSchedule = "0 */8 * * *"
startCommand = "python -m worker.ingest"
# TO RE-PAUSE: comment the two lines above and uncomment the no-op below, then redeploy.
# startCommand = "python -c \"print('ingestion paused — see railway.worker.toml')\""
# A cron job that exits non-zero shouldn't be retried in a tight loop — wait for the next tick.
restartPolicyType = "never"
