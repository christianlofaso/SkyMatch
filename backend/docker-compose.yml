# Local-dev Postgres + Redis for Pathfinder. Production uses Supabase Postgres + Railway
# Redis; this gives isolated, disposable local services matching the prod major versions.
# Not used in prod.
#
#   docker compose up -d        # start Postgres + Redis
#   alembic upgrade head        # create the schema (see CLAUDE.md "Running the project")
#   docker compose down         # stop  (add -v to also wipe the data volume)
#
# Redis is OPTIONAL for local dev: with no REDIS_URL the guard + Sonnet governor run
# in-process (single-worker behaviour). Set REDIS_URL=redis://localhost:6379/0 to exercise
# the distributed path locally.
services:
  db:
    image: postgres:16
    container_name: pathfinder-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pathfinder
    ports:
      - "5432:5432"
    volumes:
      - pathfinder-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pathfinder"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: pathfinder-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # ephemeral; guard state is recreatable
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pathfinder-pgdata:
