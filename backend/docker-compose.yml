# Local-dev Postgres for Pathfinder. Production uses Supabase Postgres; this gives an
# isolated, disposable local DB matching Supabase's major version. Not used in prod.
#
#   docker compose up -d db     # start Postgres
#   alembic upgrade head        # create the schema (see CLAUDE.md "Running the project")
#   docker compose down         # stop  (add -v to also wipe the data volume)
services:
  db:
    image: postgres:16
    container_name: pathfinder-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pathfinder
    ports:
      - "5432:5432"
    volumes:
      - pathfinder-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pathfinder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pathfinder-pgdata:
